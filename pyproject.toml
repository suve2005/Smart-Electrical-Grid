[project]
name = "smart-electrical-grid"
version = "0.1.0"
description = "Smart Electrical Grid FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "firebase-admin",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "structlog",
    "email-validator",
]

[tool.uv]
package = false