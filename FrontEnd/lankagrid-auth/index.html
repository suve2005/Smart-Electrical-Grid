<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · LankaGrid</title>
  <meta name="description" content="Sign in to LankaGrid, the Digital Twin Operations Platform for Sri Lanka's power grid.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">

  <!-- Theme init: runs before first paint so there is no light/dark flash -->
  <script>
    try {
      var t = localStorage.getItem('lg-theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js" defer></script>
</head>
<body>
  <!-- SVG icon sprite (referenced with <use>) -->
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="m1 1 22 22"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
  </svg>

  <a class="skip-link" href="#login-title">Skip to sign-in form</a>

  <!-- Dark / light toggle -->
  <button class="theme-toggle" type="button" data-theme-toggle
          aria-label="Dark mode" aria-pressed="false" title="Toggle dark mode">
    <svg class="icon i-moon" aria-hidden="true"><use href="#i-moon"/></svg>
    <svg class="icon i-sun" aria-hidden="true"><use href="#i-sun"/></svg>
  </button>

  <main class="auth-shell">
    <div class="auth-card">

      <!-- ===== Hero panel ===== -->
      <aside class="hero hero--login">
        <div class="brand">
          <!-- Inline SVG logo -->
          <svg class="brand-logo" viewBox="0 0 48 48" role="img" aria-label="LankaGrid logo" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="lg-ring" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f59e0b"/>
                <stop offset="0.5" stop-color="#22c55e"/>
                <stop offset="1" stop-color="#4f46e5"/>
              </linearGradient>
              <linearGradient id="lg-core" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#6366f1"/>
                <stop offset="1" stop-color="#3b3fd8"/>
              </linearGradient>
            </defs>
            <circle cx="24" cy="24" r="22" fill="url(#lg-ring)"/>
            <circle cx="24" cy="24" r="17" fill="url(#lg-core)"/>
            <path d="M26.5 10 15 26h8l-2 12 12-17h-8z" fill="#ffffff"/>
          </svg>
          <span class="brand-name">LankaGrid</span>
        </div>
        <p class="brand-sub">Digital Twin Operations Platform</p>

        <div class="hero-copy">
          <h2 class="hero-headline"><span>Smarter Grid.</span><span>A Resilient Sri Lanka.</span></h2>
          <p class="hero-tagline">Monitor. Analyse. Simulate. Innovate.</p>
        </div>
      </aside>

      <!-- ===== Form panel ===== -->
      <section class="form-panel" aria-labelledby="login-title">
        <div class="form-inner">
          <header class="form-head">
            <h1 class="form-title" id="login-title" tabindex="-1">Welcome Back</h1>
            <p class="form-sub">Sign in to your account</p>
          </header>

          <form class="form" id="login-form" novalidate>
            <div class="alert" id="form-alert" role="alert" hidden></div>

            <!-- Email -->
            <div class="field">
              <label class="sr-only" for="email">Email address</label>
              <div class="input-wrap">
                <svg class="icon input-icon" aria-hidden="true"><use href="#i-user"/></svg>
                <input id="email" name="email" type="email" inputmode="email"
                       autocomplete="email" placeholder="Email address"
                       required aria-describedby="email-error">
              </div>
              <p class="field-error" id="email-error" aria-live="polite"></p>
            </div>

            <!-- Password -->
            <div class="field">
              <label class="sr-only" for="password">Password</label>
              <div class="input-wrap">
                <svg class="icon input-icon" aria-hidden="true"><use href="#i-lock"/></svg>
                <input id="password" name="password" type="password"
                       autocomplete="current-password" placeholder="Password"
                       required aria-describedby="password-error">
                <button class="icon-btn" type="button" data-toggle-password="password"
                        aria-label="Show password" aria-pressed="false">
                  <svg class="icon i-eye" aria-hidden="true"><use href="#i-eye"/></svg>
                  <svg class="icon i-eye-off" aria-hidden="true"><use href="#i-eye-off"/></svg>
                </button>
              </div>
              <p class="field-error" id="password-error" aria-live="polite"></p>
            </div>

            <!-- Remember me / forgot -->
            <div class="form-row">
              <label class="check" for="remember">
                <input id="remember" name="remember" type="checkbox">
                <span>Remember me</span>
              </label>
              <button class="link-btn" type="button" id="forgot-btn">Forgot password?</button>
            </div>

            <button class="btn btn-primary" type="submit" id="submit-btn">
              <span class="spinner" aria-hidden="true"></span>
              <span class="btn-label">Sign In</span>
            </button>

            <div class="divider" role="separator"><span>or continue with</span></div>

            <button class="btn btn-outline" type="button" id="google-btn">
              <span class="spinner" aria-hidden="true"></span>
              <svg class="btn-google-logo" viewBox="0 0 48 48" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              </svg>
              <span class="btn-label">Google</span>
            </button>
          </form>

          <p class="form-foot">Don't have an account? <a href="register.html">Register</a></p>
        </div>
      </section>

    </div>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
