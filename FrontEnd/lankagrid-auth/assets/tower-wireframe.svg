<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Glowing wireframe transmission tower (placeholder)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#0b2a6b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>

  <!-- wave lines -->
  <g fill="none" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M-20 700 Q150 600 300 690 T620 650"/>
    <path d="M-20 730 Q150 630 300 720 T620 680"/>
    <path d="M-20 760 Q150 660 300 750 T620 710"/>
    <path d="M-20 790 Q150 690 300 780 T620 740"/>
    <path d="M-20 820 Q150 720 300 810 T620 770"/>
    <path d="M-20 850 Q150 750 300 840 T620 800"/>
    <path d="M-20 880 Q150 780 300 870 T620 830"/>
  </g>
  <g fill="none" stroke="#60a5fa" stroke-opacity="0.2" stroke-width="1.2">
    <path d="M-20 200 Q200 120 420 220 T640 160"/>
    <path d="M-20 240 Q200 160 420 260 T640 200"/>
    <path d="M-20 280 Q200 200 420 300 T640 240"/>
  </g>

  <!-- glowing tower -->
  <g filter="url(#glow)" stroke="#7cc4ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 130 L240 760 M300 130 L360 760"/>
    <path d="M300 130 L300 80"/>
    <path d="M270 400 L330 400 M258 520 L342 520 M248 640 L352 640 M240 760 L360 760"/>
    <path d="M300 130 L330 400 L258 520 L342 520 L248 640 L352 640 L240 760"/>
    <path d="M300 130 L270 400 L342 520 L258 520 L352 640 L248 640 L360 760"/>
    <path d="M150 240 L450 240 M205 180 L395 180 M235 300 L365 300"/>
    <path d="M195 240 L300 180 L405 240"/>
    <path d="M150 240 L150 262 M450 240 L450 262 M205 180 L205 200 M395 180 L395 200"/>
  </g>
  <g stroke="#7cc4ff" stroke-opacity="0.7" stroke-width="1.6" fill="none">
    <path d="M150 262 Q60 290 -20 280"/>
    <path d="M205 200 Q100 230 -20 215"/>
    <path d="M450 262 Q540 290 620 280"/>
    <path d="M395 200 Q500 230 620 215"/>
  </g>
</svg>
