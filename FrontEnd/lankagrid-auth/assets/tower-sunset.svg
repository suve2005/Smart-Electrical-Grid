    <path d="M530 700 q-50 -20 -80 10 q40 -10 80 0 q-30 -40 -70 -40 q50 10 70 40 q10 -50 50 -60 q-35 20 -50 60 q40 -25 80 -5 q-45 -5 -80 5z"/>
  </g>

  <!-- main tower -->
  <g stroke="#0b0a10" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 250 L250 830 M300 250 L350 830"/>
    <path d="M274 540 L326 540 M262 640 L338 640 M255 740 L345 740"/>
    <path d="M300 250 L326 540 L262 640 L338 640 L255 740 L345 740"/>
