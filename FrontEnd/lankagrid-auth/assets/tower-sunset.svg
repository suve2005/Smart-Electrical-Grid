<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Transmission tower at sunset (placeholder)">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a5a"/>
      <stop offset="0.45" stop-color="#5a4a7a"/>
      <stop offset="0.72" stop-color="#e07a4a"/>
      <stop offset="0.86" stop-color="#f5b24a"/>
      <stop offset="1" stop-color="#3b2a1f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.3" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#sky)"/>
  <rect width="600" height="900" fill="url(#sun)"/>

  <!-- distant hills / treeline -->
  <path d="M0 800 Q80 770 160 790 T320 785 T480 795 T600 780 V900 H0Z" fill="#1d1a26"/>
  <path d="M0 840 Q100 815 200 835 T400 830 T600 838 V900 H0Z" fill="#0f0e16"/>

